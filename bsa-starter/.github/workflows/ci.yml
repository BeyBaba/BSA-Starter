name: CI

# Node projelerinde her PR ve main push'unda typecheck + test + build.
# Paket yoneticisi kilit dosyasindan secilir (pnpm-lock.yaml > package-lock.json).
# Node surumu package.json "engines.node" ile ayni tutulur (node-version-file degil, burada 22).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # hashFiles job seviyesinde calismaz; Node olmayan projede adimlar tek tek atlanir.
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
      - name: Kurulum
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else npm ci; fi
      - name: Typecheck / test / build (tanimli olanlar)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          pm=npm; [ -f pnpm-lock.yaml ] && pm=pnpm
          for s in typecheck test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$s'] ? 0 : 1)"; then
              $pm run "$s"
            else
              echo "script yok: $s (atlandi)"
            fi
          done
